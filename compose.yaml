name: zerotrash

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 5050
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      REQUIRE_PHOTO_LOCATION: ${REQUIRE_PHOTO_LOCATION:-false}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      ADMIN_NAME: ${ADMIN_NAME:-ZeroTrash Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env.production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.production}
    volumes:
      - ./storage/data:/app/backend/data
      - ./storage/uploads:/app/backend/uploads
    expose:
      - "5050"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5050/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PHOTO_LOCATION_ENABLED: ${NEXT_PUBLIC_PHOTO_LOCATION_ENABLED:-false}
    restart: unless-stopped
    environment:
      TRASH_BACKEND_URL: http://backend:5050
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      HOSTNAME: 0.0.0.0
      PORT: 5173
    expose:
      - "5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/signin').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
